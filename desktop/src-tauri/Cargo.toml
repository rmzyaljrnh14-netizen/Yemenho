[package]
name = "yhq-desktop"
version = "0.6.0"
description = "تطبيق سطح المكتب — النظام الوطني لإدارة مؤشرات الأداء الصحي والجودة وسلامة المرضى"
edition = "2021"
rust-version = "1.77"

[lib]
name = "yhq_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
